short_bio: >-
  <p>
    I am an incoming Ph.D. student in Physics at <strong>Dartmouth College</strong>, set to begin in 2026. I recently completed my B.S. in Physics at <strong>Huazhong University of Science and Technology (HUST)</strong>, where I was honored as an <em>Outstanding Graduate</em>.
  </p>
  <p>
    My research lives at the intersection of <strong>theoretical and computational plasma physics</strong>, with a particular fascination for nonlinear phenomena inside turbulent plasmas. I am drawn to questions where mathematical elegance meets physical reality where we can actually compute, visualize, and understand.
  </p>

